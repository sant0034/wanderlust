version: '3.8'

services:

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wanderlust
    ports:
      - "3307:3306"
    networks:
      - microservices-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  service-registry:
    build: ./wanderlust-backend/service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    networks:
      - microservices-network

  api-gateway:
    build: ./wanderlust-backend/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - service-registry
    networks:
      - microservices-network

  user-service:
    build: ./wanderlust-backend/user-service
    container_name: user-service
    ports:
      - "8081:8081"

    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started

    networks:
      - microservices-network

  booking-service:
    build: ./wanderlust-backend/booking-service
    container_name: booking-service
    ports:
      - "8082:8082"

    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started

    networks:
      - microservices-network

networks:
  microservices-network: